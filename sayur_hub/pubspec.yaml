name: sayur_hub
description: "Aplikasi E-Commerce Sayur dan Buah Segar SMK RPL"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  go_router: ^14.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  dio: ^5.4.3+1
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#2E7D32"
  image: "assets/icons/splash_logo.png"
  android_12:
    image: "assets/icons/splash_logo.png"
    icon_background_color: "#2E7D32"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
